<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas — Your Investment Strategy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────
   RESET & TOKENS
───────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:         #0b1e12;
  --gold:       #c9a84c;
  --gold-light: #e8c97a;
  --gold-dark:  #a8872e;
  --cream:      #f4edda;
  --muted:      rgba(244, 237, 218, 0.42);
  --btn-border: rgba(244, 237, 218, 0.22);
}

/* ─────────────────────────────────────────
   LAYOUT
───────────────────────────────────────── */
html, body {
  width: 100%;
  min-height: 100vh;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  padding: 36px 24px;
  font-family: 'Instrument Sans', sans-serif;
  overflow-x: hidden;
  overflow-y: auto;
}

/* ─────────────────────────────────────────
   LOGO
───────────────────────────────────────── */
.logo {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--gold);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  opacity: 0;
  animation: fadeUp 0.6s ease 0.1s forwards;
}
.logo svg { width: 11px; height: 11px; flex-shrink: 0; }

/* ─────────────────────────────────────────
   HEADLINE
───────────────────────────────────────── */
.headline-block {
  text-align: center;
  opacity: 0;
  animation: fadeUp 0.7s ease 0.28s forwards;
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-weight: 300;
  font-size: clamp(34px, 3.6vw, 52px);
  line-height: 1.15;
  color: var(--cream);
  letter-spacing: -0.01em;
}

h1 em {
  font-style: normal;
  color: var(--gold-light);
}

.sub {
  margin-top: 12px;
  font-size: 13px;
  font-weight: 400;
  color: var(--muted);
  letter-spacing: 0.05em;
}

/* ─────────────────────────────────────────
   ATOM CANVAS
───────────────────────────────────────── */
.atom-wrap {
  position: relative;
  width: 260px;
  height: 260px;
  flex-shrink: 0;
  opacity: 0;
  animation: fadeUp 1s ease 0.48s forwards;
}

canvas#atom {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* ─────────────────────────────────────────
   CTAs
───────────────────────────────────────── */
.ctas {
  display: flex;
  flex-direction: column;
  gap: 11px;
  width: 100%;
  max-width: 360px;
  opacity: 0;
  animation: fadeUp 0.7s ease 0.85s forwards;
}

.btn {
  width: 100%;
  padding: 18px 24px;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease, border-color 0.16s ease;
  /* Typography */
  font-family: 'Instrument Sans', sans-serif;
  font-size: 15.5px;
  font-weight: 600;
  letter-spacing: 0.03em;
  line-height: 1;
}

.btn svg {
  width: 17px;
  height: 17px;
  flex-shrink: 0;
}

.btn:hover  { transform: translateY(-2px); }
.btn:active { transform: scale(0.975); }

/* Primary — gold fill */
.btn-primary {
  background: var(--gold);
  color: #0a1a0e;
  box-shadow:
    0 4px 20px rgba(201, 168, 76, 0.32),
    0 1px 0 rgba(255,255,255,0.12) inset;
}
.btn-primary:hover {
  background: var(--gold-light);
  box-shadow: 0 8px 32px rgba(201, 168, 76, 0.48);
}
.btn-primary:active {
  background: var(--gold-dark);
}

/* Secondary — ghost */
.btn-secondary {
  background: rgba(244, 237, 218, 0.04);
  color: var(--cream);
  border: 1px solid var(--btn-border);
}
.btn-secondary:hover {
  background: rgba(244, 237, 218, 0.08);
  border-color: rgba(244, 237, 218, 0.38);
}

/* ─────────────────────────────────────────
   KEYFRAMES
───────────────────────────────────────── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<!-- ── LOGO ── -->
<div class="logo">
  <svg viewBox="0 0 12 12" fill="none">
    <polygon points="6,1 11,11 1,11" stroke="currentColor" stroke-width="1.3" fill="none"/>
  </svg>
  Atlas
</div>

<!-- ── HEADLINE ── -->
<div class="headline-block">
  <h1>Your investment strategy,<br><em>executed without compromise.</em></h1>
  <p class="sub">Your rules. Your limits. Running while you live your life.</p>
</div>

<!-- ── ATOM ── -->
<div class="atom-wrap">
  <canvas id="atom" width="260" height="260"></canvas>
</div>

<!-- ── CTAs ── -->
<div class="ctas">

  <button class="btn btn-primary">
    <!-- Arrow right -->
    <svg viewBox="0 0 17 17" fill="none">
      <path d="M2.5 8.5h10M9 4.5l4 4-4 4"
            stroke="currentColor" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    I have a strategy
  </button>

  <button class="btn btn-secondary">
    <!-- Sparkle / wand — build -->
    <svg viewBox="0 0 17 17" fill="none">
      <path d="M3 14L10 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M10 3l.6 1.4L12 5l-1.4.6L10 7l-.6-1.4L8 5l1.4-.6L10 3z"
            stroke="currentColor" stroke-width="1.2"
            stroke-linejoin="round"/>
      <path d="M5 5l.4.9.9.4-.9.4L5 7.6l-.4-.9-.9-.4.9-.4L5 5z"
            stroke="currentColor" stroke-width="1.1"
            stroke-linejoin="round"/>
    </svg>
    Help me build one
  </button>

</div>

<!-- ── ATOM CANVAS SCRIPT ── -->
<script>
(function () {
  const canvas = document.getElementById('atom');
  const ctx    = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;

  /* ── Orbital config ── */
  const orbits = [
    { rx: 98,  ry: 29, tiltZ:   0, speed:  0.72, phase: 0,                eSize: 4.5 },
    { rx: 90,  ry: 32, tiltZ:  60, speed: -0.55, phase: Math.PI * 0.6,    eSize: 4   },
    { rx: 84,  ry: 27, tiltZ: 120, speed:  0.88, phase: Math.PI * 1.2,    eSize: 3.5 },
    { rx: 78,  ry: 24, tiltZ: -50, speed: -0.65, phase: Math.PI * 1.7,    eSize: 3.5 },
  ];

  /* ── Nucleus micro-particles ── */
  const nucleusParticles = Array.from({ length: 14 }, (_, i) => ({
    angle: (i / 14) * Math.PI * 2,
    r:     4  + Math.random() * 9,
    speed: 0.3 + Math.random() * 0.5,
    phase: Math.random() * Math.PI * 2,
    size:  1.2 + Math.random() * 2,
  }));

  /* ── Ambient dust ── */
  const dust = Array.from({ length: 40 }, () => ({
    x:     Math.random() * W,
    y:     Math.random() * H,
    r:     0.5 + Math.random() * 1.1,
    a:     0.07 + Math.random() * 0.16,
    speed: 0.004 + Math.random() * 0.007,
    phase: Math.random() * Math.PI * 2,
  }));

  /* ── Trails ── */
  const TRAIL_LEN = 30;
  const trails = orbits.map(() => []);

  /* ── Helpers ── */
  function toRad(d) { return d * Math.PI / 180; }

  function electronPos(orbit, t) {
    const a    = t * orbit.speed + orbit.phase;
    const cosZ = Math.cos(toRad(orbit.tiltZ));
    const sinZ = Math.sin(toRad(orbit.tiltZ));
    const ex   = orbit.rx * Math.cos(a);
    const ey   = orbit.ry * Math.sin(a);
    return {
      x:     cx + ex * cosZ - ey * sinZ,
      y:     cy + ex * sinZ + ey * cosZ,
      depth: Math.sin(a),
    };
  }

  function drawRing(orbit, alpha) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(toRad(orbit.tiltZ));
    ctx.beginPath();
    ctx.ellipse(0, 0, orbit.rx, orbit.ry, 0, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(201,168,76,${alpha})`;
    ctx.lineWidth   = 0.75;
    ctx.stroke();
    ctx.restore();
  }

  function drawTrail(trail, maxSize) {
    for (let i = 0; i < trail.length; i++) {
      const p        = trail[i];
      const progress = i / trail.length;
      const alpha    = progress * 0.32;
      const size     = maxSize * progress * 0.65;
      if (size < 0.25) continue;
      ctx.beginPath();
      ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(201,168,76,${alpha})`;
      ctx.fill();
    }
  }

  function drawElectron(pos, size, alpha) {
    // soft halo
    const grd = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, size * 5);
    grd.addColorStop(0, `rgba(232,201,122,${alpha * 0.55})`);
    grd.addColorStop(1, 'rgba(201,168,76,0)');
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, size * 5, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();
    // core
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(240,216,120,${alpha})`;
    ctx.fill();
  }

  function drawNucleus(t) {
    // layered bloom
    [
      { r: 50, a: 0.04 },
      { r: 36, a: 0.07 },
      { r: 24, a: 0.12 },
      { r: 16, a: 0.20 },
    ].forEach(({ r, a }) => {
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      g.addColorStop(0, `rgba(201,168,76,${a})`);
      g.addColorStop(1, 'rgba(201,168,76,0)');
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
    });

    // breathing ring
    const pulse = 0.5 + 0.5 * Math.sin(t * 1.2);
    ctx.beginPath();
    ctx.arc(cx, cy, 14 + pulse * 4, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(201,168,76,${0.11 + pulse * 0.09})`;
    ctx.lineWidth = 1;
    ctx.stroke();

    // core sphere
    const grad = ctx.createRadialGradient(cx - 3, cy - 3, 1, cx, cy, 11);
    grad.addColorStop(0,   '#f5e080');
    grad.addColorStop(0.4, '#c9a84c');
    grad.addColorStop(1,   'rgba(130,85,18,0.6)');
    ctx.beginPath();
    ctx.arc(cx, cy, 11, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    // micro inner cluster
    nucleusParticles.forEach(p => {
      const a  = p.angle + t * p.speed;
      const px = cx + Math.cos(a) * (p.r * (0.7 + 0.3 * Math.sin(t * 0.4 + p.phase)));
      const py = cy + Math.sin(a) * (p.r * (0.7 + 0.3 * Math.cos(t * 0.4 + p.phase)));
      ctx.beginPath();
      ctx.arc(px, py, p.size * (0.7 + 0.3 * Math.sin(t + p.phase)), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(232,201,122,${0.22 + 0.32 * Math.sin(t * 1.1 + p.phase)})`;
      ctx.fill();
    });
  }

  function drawDust(t) {
    dust.forEach(d => {
      const a = d.a * (0.5 + 0.5 * Math.sin(t * d.speed + d.phase));
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(201,168,76,${a})`;
      ctx.fill();
    });
  }

  /* ── Render loop ── */
  let t0 = null;

  function frame(ts) {
    if (!t0) t0 = ts;
    const t = (ts - t0) / 1000;

    ctx.clearRect(0, 0, W, H);

    // canvas-level glow
    const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 155);
    bg.addColorStop(0, 'rgba(201,168,76,0.052)');
    bg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    drawDust(t);

    // compute all positions
    const data = orbits.map((orbit, i) => ({ orbit, i, pos: electronPos(orbit, t) }));

    // back layer
    data.forEach(({ orbit, i, pos }) => {
      if (pos.depth >= 0) return;
      const d = (pos.depth + 1) / 2;
      drawRing(orbit, 0.09);
      drawTrail(trails[i], orbit.eSize);
      drawElectron(pos, orbit.eSize * (0.72 + 0.28 * d), 0.5 + 0.22 * d);
    });

    drawNucleus(t);

    // front layer
    data.forEach(({ orbit, i, pos }) => {
      if (pos.depth < 0) return;
      const d = (pos.depth + 1) / 2;
      drawRing(orbit, 0.17);
      drawTrail(trails[i], orbit.eSize);
      drawElectron(pos, orbit.eSize * (0.72 + 0.28 * d), 0.7 + 0.25 * d);
    });

    // update trails
    orbits.forEach((orbit, i) => {
      const pos = electronPos(orbit, t);
      trails[i].push({ x: pos.x, y: pos.y });
      if (trails[i].length > TRAIL_LEN) trails[i].shift();
    });

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
